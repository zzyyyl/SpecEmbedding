general:
  seed: 42
  device: "cuda" # or "cpu", "cuda:0", "cuda:1"
  save_dir: "checkpoints"

data:
  dataset_type: "massspecgym" # or "local"
  data_path: "data/processed"
  cache_path: "data/train_cache"
  raw_path: "data/raw"
  candidates_path: "data/candidates"
  cid_smiles_path: "data/candidates/CID-SMILES"
  pubchem_cache_path: "data/pubchem_similarity_cache"
  tokenizer:
    max_len: 100
    show_progress_bar: true

augmentation:
  prob: 0.5
  removal_max: 0.2
  removal_intensity: 0.3
  rate_intensity: 0.15
  node_drop_rate: 0.1
  edge_mask_rate: 0.1

model:
  spec_encoder:
    embedding_dim: 512
    n_head: 16
    n_layer: 4
    dim_feedward: 512
    dim_target: 512
    feedward_activation: "selu"
  mol_encoder:
    emb_dim: 128
    n_layers: 4
    dropout_rate: 0.2
    size_feature_dim: 32
    norm_type: "layernorm" # layernorm or rmsnorm
    norm_eps: 0.00001
    graph_policy: legacy_raw # old checkpoints; v1.5 runner explicitly selects rdkit_sanitized
  align:
    final_dim: 512
    dropout_rate: 0.2
    tau: 0.07

train:
  pretrain:
    batch_size: 512
    epochs: 50
    lr: 0.000075 # 7.5e-5
    weight_decay: 0.1
    loss:
      temperature: 0.05
      base_temperature: 0.05
    early_stop: 20
  align:
    batch_size: 128
    epochs_stage1: 50
    epochs_stage2: 100
    graph_cache_size: 10000 # 0 disables graph cache, -1 means unlimited
    lr: 0.0001 # 1e-4
    weight_decay: 0.0001 # 1e-4
    patience: 5
    num_workers: 4

eval:
  replications: 10
  top_k: [1, 5, 10, 20]
  loader_batch_size: 1024
  calc_batch_size: 512

rerank:
  prepare:
    checkpoint: null
    dataset_type: "massspecgym"
    split: "train"
    data_path: null # null means data.data_path
    save_path: null
    candidate_type: "mass" # mass, formula, or supplied (NPLIB1 default via CLI)
    candidate_path: null
    pre_top_k: 256
    force_include_positive: false
    spec_batch_size: 512
    mol_batch_size: 512
    candidate_chunk_size: 4096
    mol_embedding_storage: "cpu"
    mol_embedding_dtype: "float16"
    mol_norm_type: null # null means model.mol_encoder.norm_type
    mol_norm_eps: null # null means model.mol_encoder.norm_eps
    num_workers: 4
    limit: 0
  train:
    train_cache: null
    val_cache: null
    save_dir: "checkpoints_rerank"
    model_type: "relative"
    train_k: 256
    batch_size: 8
    epochs: 30
    lr: 0.0001
    weight_decay: 0.0001
    patience: 5
    hidden_dim: 512
    rank_emb_dim: 32
    max_rank: 512
    n_layers: 2
    n_heads: 8
    dropout: 0.1
    alpha_init: 1.0
    use_base_score_feature: true
    use_residual_score: true
    use_rank_embedding: false
    use_product_feature: true
    use_abs_diff_feature: true
    shuffle_candidates: true
    lambda_pair: 0.2
    lambda_spec: 0.1
    spec_margin: 0.1
    relation_dim: 32
    pair_chunk_size: 16
    relation_top_k: 40
    use_relative_module: true
    use_spectrum_conditioning: true
    use_molecular_relation: true
    use_spectrum_features: true
    use_molecule_features: true
    use_antisymmetric: true
    pair_mode: "antisymmetric"
    margin: 0.1
    grad_clip: 1.0
    metric_for_best: "mrr"
    num_workers: 0
    top_k: [1, 5, 10, 20]
  eval:
    cache: null
    checkpoint: null
    save_dir: null
    batch_size: 32
    num_workers: 0
    top_k: [1, 5, 10, 20]
    compute_mces: true

fulltrain:
  v15:
    graph_policy: rdkit_sanitized
    alignment_seed: 42
    audit_workers: 4
    sources:
      MassSpecGym1.5.tsv: 50cfdd1d22f79543c59555f9ce43c6893bd788a19a42b21fb4e2e3a54673c06a
      MassSpecGym1.5_retrieval_candidates_mass.json: 9536a330cba24c399271364889119f90124579400dba14e9f78630c75c13c73a
      MassSpecGym1.5_retrieval_candidates_formula.json: 454636d2346aebb3cd87edc2efc3fa1bf91eb8e0219edff5880f02aa537ac954
  candidate_types: [mass, formula]
  model_types: [relative, pointwise]
  seeds: [42, 43, 44]
  expected_counts: {train: 194119, val: 19429, test: 17556}
  exclude_val_query_indices: [7686, 7687, 7688, 8464, 8465, 8466]
  min_free_mib: 20000
  max_utilization: 10
  poll_seconds: 30
  hold_seconds: 120

paths:
  pretrained_models:
    supcon_tanimoto_aug: "checkpoints/legacy/transformer-SupConWithTanimotoLoss-Augmentation/model.ckpt"
    supcon_tanimoto: "checkpoints/legacy/transformer-SupConWithTanimotoLoss/model.ckpt"
    supcon: "checkpoints/legacy/transformer-SupConLoss/model.ckpt"
    tanimoto: "checkpoints/legacy/transformer-TanimotoLoss/model.ckpt"
